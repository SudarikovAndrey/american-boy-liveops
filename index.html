// ===== Карточка точки или бизнеса вырастает из строки клетки и сворачивается в неё =====
// На экране всегда один элемент: пока карточка открыта, строки нет. Бумажная плашка
// растёт из прямоугольника строки до карточки с лёгким перелётом (0.86 → 1.04 → 1,
// навык cartoon-animation), текст строки гаснет, карточка проявляется. Закрытие — обратно.
// Кубик остаётся ярким и рабочим: тап сворачивает карточку и сразу бросает.
(function(){
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const isSheet=()=>/\b(print-property|illustrated-property|business-property)\b/.test($('card').className);
  const open=()=>document.body.classList.contains('tile-sheet');
  let plate=null;
  const box=el=>{const r=el.getBoundingClientRect();return {left:r.left,top:r.top,width:r.width,height:r.height};};
  const visible=el=>{if(!el||el.hidden)return false;const r=el.getBoundingClientRect();return r.width>40&&r.height>20;};
  const px=b=>({left:b.left+'px',top:b.top+'px',width:b.width+'px',height:b.height+'px'});
  const grow=(b,k)=>({left:b.left-b.width*k/2,top:b.top-b.height*k/2,width:b.width*(1+k),height:b.height*(1+k)});
  function dropPlate(){plate?.remove();plate=null;}
  function makePlate(from,withRow){
    dropPlate();plate=document.createElement('div');plate.className='tile-sheet-plate';plate.setAttribute('aria-hidden','true');
    if(withRow){const row=document.createElement('div');row.className='tile-sheet-row';row.innerHTML=$('tilebar').innerHTML;plate.append(row);}
    Object.assign(plate.style,px(from));document.body.append(plate);return plate;
  }
  // Кошелёк при открытой карточке точки: карточка начинается под строкой денег и кристаллов,
  // и та остаётся видна сквозь лёгкое затемнение (плейтест 01.10: игрок закрывал окно точки,
  // чтобы посмотреть, хватает ли денег).
  function showWallet(){
    const row=document.querySelector('#top .bar1');if(!row)return;
    const r=row.getBoundingClientRect();if(r.height<10)return;
    document.documentElement.style.setProperty('--sheet-top',Math.round(r.bottom+8)+'px');
  }
  function hideWallet(){document.documentElement.style.removeProperty('--sheet-top');}
  function enter(){
    const card=$('card'),bar=$('tilebar');
    document.body.classList.add('tile-sheet');showWallet();
    if(reduced.matches||CFG.SPEED>=100||!visible(bar)){bar.classList.add('tile-sheet-away');return;}
    const from=box(bar);bar.classList.add('tile-sheet-away');
    PaperMotion.stop(card);const to=box(card);
    const p=makePlate(from,true);card.style.opacity='0';
    const a=p.animate([{...px(from),borderRadius:'12px'},{...px(grow(to,.03)),borderRadius:'16px',offset:.72},{...px(to),borderRadius:'16px'}],
      {duration:240,easing:'cubic-bezier(.16,.78,.24,1)',fill:'forwards'});
    p.firstChild?.animate([{opacity:1},{opacity:0,offset:.35},{opacity:0}],{duration:240,fill:'forwards'});
    a.finished.then(()=>{
      if(plate!==p)return;
      card.style.opacity='';
      card.animate([{opacity:0},{opacity:1}],{duration:90,easing:'ease-out'});
      p.animate([{opacity:1},{opacity:0}],{duration:90,fill:'forwards'}).finished.then(()=>{if(plate===p)dropPlate();},()=>{});
    },()=>{});
  }
  function leave(){
    const card=$('card'),bar=$('tilebar');
    const done=()=>{document.body.classList.remove('tile-sheet');bar.classList.remove('tile-sheet-away');dropPlate();card.style.opacity='';hideWallet();};
    if(reduced.matches||CFG.SPEED>=100||bar.hidden){done();return;}
    const from=box(card);bar.classList.remove('tile-sheet-away');bar.style.visibility='hidden';
    const to=visible(bar)?box(bar):null;
    if(!to){bar.style.visibility='';done();return;}
    card.style.opacity='0';
    const p=makePlate(from,true);p.firstChild.style.opacity='0';
    const a=p.animate([{...px(from),borderRadius:'16px'},{...px(to),borderRadius:'12px'}],{duration:200,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
    p.firstChild.animate([{opacity:0},{opacity:0,offset:.55},{opacity:1}],{duration:200,fill:'forwards'});
    a.finished.then(()=>{if(plate!==p)return;bar.style.visibility='';done();},()=>{bar.style.visibility='';done();});
  }
  const baseCustom=openCustom;
  openCustom=function(...args){
    const fresh=$('modal').hidden||$('modal').classList.contains('closing');
    const res=baseCustom.apply(this,args);
    if(isSheet()&&(fresh||!open()))enter();
    else if(!isSheet()&&open()){document.body.classList.remove('tile-sheet');$('tilebar').classList.remove('tile-sheet-away');dropPlate();hideWallet();}
    return res;
  };
  const baseClose=closeModal;
  closeModal=function(...args){
    const was=open()&&!$('modal').hidden&&!$('modal').classList.contains('closing');
    const res=baseClose.apply(this,args);
    if(was)leave();
    return res;
  };
  // Подсказка Джонни бывает привязана к строке клетки. Строка ушла в карточку — подсказка
  // прячется, а фокус-размытие (coach-tip-open) оставалось на весь экран. Снимаем его вместе с ней.
  new MutationObserver(()=>{if($('tip').hidden)document.body.classList.remove('coach-tip-open');})
    .observe($('tip'),{attributes:true,attributeFilter:['hidden']});
  // Кубик поверх открытой карточки: сворачиваем её и бросаем тем же обычным нажатием.
  $('bRoll').addEventListener('click',e=>{
    if(!open()||$('modal').hidden)return;
    e.stopImmediatePropagation();e.preventDefault();
    closeModal();
    setTimeout(()=>{if($('modal').hidden&&!moving)$('bRoll').click();},170);
  },true);
})();

// ===== Одно правило для всех кнопок покупки (решение продюсера 30.09.2026) =====
// Хватает — зелёная эмаль, не хватает — тёмно-серая. Никаких красных и синих «Купить».
// Цена на кнопке всегда полная; «не хватает» — подпись рядом, а не сумма нехватки.
// Модуль только красит: какая кнопка чем является, решают окна; здесь — общий список.
(function(){
  const BUY=[
    '#kBuy','#bBuy','.shop button.buy','.shop button.uup-btn',       // точка и бизнес: купить, улучшить
    '#wAll','.warehouse-bulk','.warehouse-row button','.wrow button', // Costco
    '.shop-buy','#bpBuy',                                             // магазин, премиум
    '#hZone',                                                         // раннее открытие улицы
    '.insp-btn[data-v="1"]','.insp-btn[data-v="3"]',                  // инспектор в карточке: заплатить, откупиться
  ].join(',');
  // Кнопки попапов modal(): покупка/оплата узнаётся по глаголу в начале подписи.
  const VERB=/^(Купить|Заплатить|В минус|Откупиться|Улучшить|Прокачать|Закупить|Пополнить|Открыть премиум|Открыть за|Взять)/;
  // «В минус $N» — доступное действие (платить в долг правилами разрешено): кнопка зелёная.
  const short=b=>b.disabled||/^Не хватает/.test(b.textContent.trim())||b.classList.contains('poor');
  function paint(root){
    root.querySelectorAll('button').forEach(b=>{
      const text=b.textContent.replace(/\s+/g,' ').trim();
      if(!(b.matches(BUY)||VERB.test(text)))return;
      const no=short(b);
      b.classList.add('buy-btn');b.classList.toggle('buy-ok',!no);b.classList.toggle('buy-no',no);
      if(b.dataset.enamel&&b.dataset.enamel!==(no?'dark':'green'))b.dataset.enamel=no?'dark':'green';
    });
  }
  // Деньги пришли или ушли, пока окно открыто (дубль, рента, находка): кнопка покупки за полную цену
  // и пункты стройки пересчитываются сразу. Плейтест 01.10: кнопка осталась серой, хотя денег уже хватало.
  const priceOf=text=>{const m=String(text).replace(/\s+/g,' ').match(/(\d[\d,]*)\s*$/);return m?+m[1].replace(/,/g,''):null;};
  function live(){
    const card=$('card');if(!card||$('modal').hidden||typeof S==='undefined'||!S)return;
    for(const b of card.querySelectorAll('#bBuy,#kBuy')){
      const p=priceOf(b.textContent);if(p==null)continue;const no=S.cash<p;if(b.disabled===no)continue;
      b.disabled=no;const need=b.parentNode&&b.parentNode.querySelector('.need');if(need)need.hidden=!no;
    }
    for(const o of card.querySelectorAll('.sf-opt,.sf-lic-doc:not(.owned)')){
      const m=(o.getAttribute('aria-label')||'').match(/\$(\d+)/);if(!m)continue;const no=S.cash<+m[1];
      if(o.classList.contains('poor')===no)continue;
      o.classList.toggle('poor',no);o.tabIndex=no?-1:0;if(no)o.setAttribute('aria-disabled','true');else o.removeAttribute('aria-disabled');
      if(o.dataset.i!=null){const b=card.querySelector(`.mbtns button[data-i="${o.dataset.i}"]`);if(b)b.disabled=no;}   // стройка жмёт скрытую кнопку окна
    }
  }
  if(typeof render==='function'){const base=render;render=function(){const r=base.apply(this,arguments);try{live();}catch(e){}return r;};}
  let queued=false;
  const run=()=>{queued=false;paint($('card'));const po=document.querySelector('.pass-offer');if(po)paint(po);};
  const schedule=()=>{if(!queued){queued=true;requestAnimationFrame(run);}};
  new MutationObserver(schedule).observe($('card'),{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','class']});
  new MutationObserver(schedule).observe(document.body,{childList:true});
})();

// ===== Миссии сверху — свёрнуты, выезжают, когда действие игрока их продвигает =====
// Плейтест 01.10: три миссии постоянно висели над полем и мешали. Ряд #qrow вынесен из
// потока шапки (поле получает его место) и показывается на несколько секунд, когда растёт
// прогресс любой миссии, появляется новая или миссию можно забрать — тогда до забора.
(function(){
  const row=$('qrow');if(!row)return;
  const PEEK=3600;
  let last=null,timer=0,first=true;
  const chips=()=>[...row.querySelectorAll('.qchip:not([hidden]), .m1-task')].filter(e=>e.offsetParent!==null||e.closest('#m1Tasks,#sfTasks'));
  const ratio=e=>parseFloat(e.style.getPropertyValue('--mission-ratio'))||0;
  const claimable=()=>chips().some(e=>e.classList.contains('done'));
  function snapshot(){return chips().map(e=>({k:(e.dataset.kind||'')+'|'+(e.querySelector('span')?.textContent||''),r:ratio(e),ok:e.classList.contains('done')||e.classList.contains('ok')}));}
  function peek(bumped){
    document.body.classList.add('missions-peek');
    bumped.forEach(e=>{e.classList.remove('mission-bump');void e.offsetWidth;e.classList.add('mission-bump');});
    clearTimeout(timer);
    timer=setTimeout(()=>{timer=0;if(!claimable())document.body.classList.remove('missions-peek');},PEEK);
  }
  function check(){
    const now=snapshot(),els=chips();
    if(first){first=false;last=now;if(now.length)peek([]);return;}   // первый показ — чтобы игрок знал, что миссии есть
    const prev=new Map((last||[]).map(x=>[x.k,x]));
    const bumped=els.filter((e,i)=>{const p=prev.get(now[i].k);return !p||now[i].r>p.r+1e-6||(now[i].ok&&!p.ok);});
    last=now;
    if(bumped.length)peek(bumped);

  // проверяем после кадра: шапка (top-hud.js) пишет --mission-ratio в своей обёртке render
  let queued=false;
  const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;try{check();}catch(e){}});};
  const base=render;render=function(){const r=base.apply(this,arguments);schedule();return r;};
  // тап по свёрнутому ряду не нужен: шапка «Билета» открывает все задания
  addEventListener('load',()=>setTimeout(schedule,400));
})();

// ===== Банк: условия возврата видны заранее =====

    const seized=seizePlan(owe),k=seized.length,mine=S.tiles.filter(t=>(t.type==='kiosk'||t.type==='biz')&&t.owner&&unlocked(t)).length;
    const what=k?`${k} ${plural(k,'лучшую точку','лучшие точки','лучших точек')}`:'ничего';

      return b;
    }
    const rows=[
      ['Вернуть',`$${owe} — когда захочешь: встань на банк и нажми «Погасить»`],
      ['Процент',interest?`$${interest} при каждом проходе банка`:'нет'],
      ['Опасно','закончить день в минусе'+(grace>0?' — первый раз банк простит':'')],
      ['Если не выбрался',`просрочка; после ${strikes}-й заберут ${what}`+(k?(left?` — остальные ${left} ${plural(left,'точка','точки','точек')} твои`:''):'')+'. Игра продолжается'],

// ===== Логи партий: копятся на телефоне и сами уходят на приёмник =====
// Приёмник — Apps Script «Америкэн бой — партии тестировщиков», лист runs
// (черновики/америкэн-бой-сбор-данных.md). Формат прежний: POST text/plain с JSON {summary, events};
// приёмник раскладывает известные поля по колонкам, остальное лежит в json-колонках сводки и событий.
//
// Чем отличается от прототипа (там лог жил только в localStorage и терялся):
// • очередь «исходящие» хранит ВСЕ неотправленные порции любых партий; порция удаляется только
//   после ответа приёмника «ok» (он читается: Apps Script отдаёт CORS);
// • отправка — каждые 10 событий, раз в 30 с, при уходе со вкладки (fetch keepalive),
//   при закрытии страницы (sendBeacon) и в конце партии; при следующем открытии игра досылает остаток;
// • у каждого события настоящее время с поясом устройства (at), секунды от начала партии (sec),
//   в мультиплеере — ещё время хозяина стола (hostAt) и место за столом;
// • у порции свой id (bid): если ответ потерялся и порция ушла дважды, дубль отбрасывается по bid.
// Выключить в своём браузере: ?tm= (пусто); вернуть: ?tm=on; другой приёмник: ?tm=<url>.
(function(){
  if(typeof track!=='function'||typeof pending==='undefined')return;
  const DEFAULT_URL='https://script.google.com/macros/s/AKfycbwWyE62gs3S_sF3NuT4iAktoNcXkq1uzjJIgO_pCfJjjjnvgN-2W3FOBHsZ2yqSzhCi/exec';
  const BUILD='3da3e96ada';              // хэш сборки, подставляет tools/build_mobile.py
  const OUTK=LS+'_outbox', DROPK=LS+'_outbox_dropped';
  const MAX_OUT=2.5e6;                     // ~2,5 МБ очереди; старшие порции вытесняются, счёт — в сводке
  const CHUNK=38000;                       // ячейка таблицы держит 50 000 символов — событий в порции меньше
  const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true;}catch(e){return false;}};

  // Начало партии: соло — S.startedAt, мультиплеер — старт стола по часам хозяина.
  function stamp(){

      dropped:+lsGet(DROPK)||0,url:location.pathname+location.search.replace(/([?&])tm=[^&]*/,'$1')});

      s.player=m.name||s.player;
      s.mp={room:m.room,match:m.match,seat:m.seat,pid:m.pid,host:!!m.host,players:m.players,names:m.names,
        rounds:m.rounds,turnSec:m.turnSec,startedAt:m.startedAt||null,startedAtISO:m.startedAt?isoLocal(m.startedAt):null,
        phase:m.phase,mpBuild:m.mpBuild||null,clockOffMs:m.clockOff||0};
      if(m.phase==='over')s.finished=true;
    }
    return s;
  }

  // ---- очередь исходящих ----
  let out=[];try{out=JSON.parse(lsGet(OUTK)||'[]');if(!Array.isArray(out))out=[];}catch(e){out=[];}
  function save_(){
    let str=JSON.stringify(out);

    if(!lsSet(OUTK,str)){while(out.length>1){out.shift();lsSet(DROPK,String((+lsGet(DROPK)||0)+1));if(lsSet(OUTK,JSON.stringify(out)))break;}}

  let seq=+lsGet(LS+'_outbox_seq')||0;
  const newBid=()=>{seq++;lsSet(LS+'_outbox_seq',String(seq));return Date.now().toString(36)+'-'+seq.toString(36)+'-'+Math.random().toString(36).slice(2,6);};
  // Положить порцию в очередь: события режутся так, чтобы ячейка таблицы их вместила.
  function enqueue(sum,events){
    events=events||[];

    for(const e of events){const l=JSON.stringify(e).length+1;if(cur.length&&len+l>CHUNK){parts.push(cur);cur=[];len=0;}cur.push(e);len+=l;}
    if(cur.length||!parts.length)parts.push(cur);

  // Копии старых логов откладывает web/tm-rescue.js раньше прототипа (abrescue:<ключ>:<партия>).
  // Ставим в очередь с пометкой recovered и удаляем копию. Старые события — без поля at;
  // события новой телеметрии уже ушли обычным путём и не повторяются. Каждую партию — один раз.
  (function recover(){
    const RK='ablive_recovered';let done={};try{done=JSON.parse(lsGet(RK)||'{}')||{};}catch(e){done={};}
    const mark=k=>{done[k]=Date.now();lsSet(RK,JSON.stringify(done));};
    const base=()=>({recovered:true,recoveredAt:isoLocal(Date.now()),build:BUILD,tz:TZ,url:location.pathname,player:lsGet('abmp_name')||null});
    function runlog(k,all){
      const id=(all.summary&&all.summary.runId)||all.runId,ev=(all.events||[]).filter(e=>!e.at);
      const tag='runlog:'+k+':'+id;if(!id||done[tag]||!ev.length)return;
      enqueue(Object.assign(base(),all.summary||{},{recovered:true,runId:id,source:k,recoveredEvents:ev.length}),ev);mark(tag);
    }
    function log(k,ev){
      ev=(Array.isArray(ev)?ev:[]).filter(e=>!e.at);if(!ev.length)return;
      const tag='log:'+k+':'+ev.length+':'+(ev[ev.length-1].t||0);if(done[tag])return;
      enqueue(Object.assign(base(),{runId:'recovered-'+k+'-'+(ev[0].t||0),source:k,recoveredEvents:ev.length}),ev);mark(tag);
    }
    function table(k,T){
      if(!T||!T.match||T.startedAt)return;const tag='table:'+k+':m'+T.match;if(done[tag])return;
      const ev=[];(T.log||[]).forEach((note,i)=>ev.push({type:'table_log',i,note:typeof note==='string'?note:JSON.stringify(note)}));
      (T.players||[]).forEach(p=>((p.s&&p.s.log)||[]).forEach((line,i)=>ev.push({type:'player_log',pid:p.pid,name:p.name,seat:p.seat,i,line:typeof line==='string'?line:JSON.stringify(line)})));
      if(!ev.length)ev.push({type:'table_empty'});
      enqueue(Object.assign(base(),{kind:'mp_table_recovered',runId:`mp-${T.room||k.slice(10)}-m${T.match}-table-recovered`,player:'стол '+(T.room||k.slice(10)),source:k,
        room:T.room||k.slice(10),match:T.match,phase:T.phase,settings:T.settings||null,result:T.result||null,finalRound:T.finalRound||null,
        turn:T.turn?{n:T.turn.n,round:T.turn.round,pid:T.turn.pid}:null,
        players:(T.players||[]).map(p=>({pid:p.pid,name:p.name,seat:p.seat,color:p.color,online:p.online,cash:p.s?Math.round(p.s.cash||0):null,laps:p.s?p.s.laps||0:null,
          pts:p.s?p.s.pts||0:null,stat:p.s?p.s.stat||null:null,loans:p.s&&p.s.loans?p.s.loans.length:0,owned:(p.s&&p.s.tiles||[]).filter(t=>t.owner).length})),
        tiles:(T.tiles||[]).filter(t=>t&&t.owner).map(t=>({i:t.i,type:t.type,name:t.name||null,owner:t.owner,tier:t.tier||null}))}),ev);

    for(const k of keys.filter(k=>k.startsWith('abrescue:'))){   // копии, отложенные до прототипа

  const inflight=new Set();let busy=false,failAt=0;
  async function post(b,keepalive){

  // Прототип: flush() → localFlush() держал полный лог одной (последней) партии в FULLK — это
  // оставляем для «Экспорта»; отправка теперь идёт через очередь.

      chunk.forEach(e=>{if(!e.at&&e.t)e.at=isoLocal(e.t);});   // уходят сейчас — спасение (recover) их не повторит
      try{const all=JSON.parse(lsGet(FULLK)||'{}');if(all.runId!==S.runId){all.runId=S.runId;all.events=[];}
        all.events=(all.events||[]).concat(chunk).slice(-3000);all.summary=summary();lsSet(FULLK,JSON.stringify(all));}catch(e){}

  }

  // Конец партии (соло): финальная сводка сразу.
  let wasFinished=null;
  {const base=render;render=function(){const r=base.apply(this,arguments);
    try{const f=!!(S&&S.finished);if(wasFinished===false&&f)flush(true);wasFinished=f;}catch(e){}return r;};}
})();

// ===== Направленный рандом бросков (бэклог §9–12) =====
// Дизайн: черновики/америкэн-бой-направленный-рандом.md.
// Кубик честный, пока не сработал триггер: засуха по складам (§10) или полиция
// два круга подряд (§11). Тогда перед броском меняются веса сумм 2–12, пара
// кубиков берётся случайно из комбинаций выбранной суммы, а поле показывает её
// обычным кувыркающимся броском (перемаркировка граней после предпросчёта).
// §12: веса не читают наличные, запас, долг, кристаллы и очки — только позицию,
// клетки поля и счётчики кругов.
CFG.DR={
  on:true,
  dryLaps1:3, dryLaps2:4,   // кругов без склада до магнита и сильного магнита
  q1:.25, q2:.45,           // целевая вероятность попасть на склад этим броском
  cap1:4, cap2:8,           // потолок множителя одной суммы
  tv:.35,                   // потолок отклонения распределения от честного
  policeStreak:2,           // полиция на стольких кругах подряд…
  policeBlockLaps:1,        // …и столько следующих кругов суммы в полицию не выпадают
};
const DR_P0=(()=>{const p={};for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)p[a+b]=(p[a+b]||0)+1/36;return p;})();
function drState(){
  if(!S.dr)S.dr={laps:S.laps||0,dry:0,lapWh:false,polLap:-9,polStreak:0,polBlockUntil:-9,rolls:0,guided:0,mismatch:0};
  return S.dr;
}
// Засуха считается полными кругами без остановки на складе, пока есть своя точка.
function drLapTick(){
  const d=drState();
  while(d.laps<S.laps){d.laps++;if(!d.lapWh&&myKiosks().length)d.dry++;d.lapWh=false;}
}
function drLanded(t){
  const d=drState();
  if(t.type==='wh'&&unlocked(t)){d.dry=0;d.lapWh=true;}
  if(t.type==='police'){
    if(d.polLap===S.laps-1)d.polStreak++;else if(d.polLap!==S.laps)d.polStreak=1;
    d.polLap=S.laps;
    if(d.polStreak>=CFG.DR.policeStreak)d.polBlockUntil=S.laps+CFG.DR.policeBlockLaps;
  }
}
function drWeights(pos){
  const d=drState(),c=CFG.DR,w={...DR_P0},trig=[];
  const at=s=>S.tiles[(pos+s)%40];
  if(d.dry>=c.dryLaps1){
    const strong=d.dry>=c.dryLaps2,q=strong?c.q2:c.q1,cap=strong?c.cap2:c.cap1;
    const hit=s=>at(s).type==='wh'&&unlocked(at(s));
    let p=0;for(const s in w)if(hit(+s))p+=w[s];
    if(p>0&&p<q){const k=Math.min(cap,q*(1-p)/(p*(1-q)));for(const s in w)if(hit(+s))w[s]*=k;trig.push(strong?'wh_pity2':'wh_pity1');}
  }
  if(S.laps>d.polLap&&S.laps<=d.polBlockUntil){
    for(const s in w)if(at(+s).type==='police'&&w[s]>0){w[s]=0;if(!trig.includes('police'))trig.push('police');}
  }
  if(!trig.length)return null;
  let tot=0;for(const s in w)tot+=w[s];for(const s in w)w[s]/=tot;
  let tv=0;for(const s in w)tv+=Math.abs(w[s]-DR_P0[s])/2;
  // Полицию не возвращаем при сжатии: её ноль — жёсткое правило §11.
  if(tv>c.tv&&!trig.includes('police')){const k=c.tv/tv;for(const s in w)w[s]=DR_P0[s]+(w[s]-DR_P0[s])*k;}
  return {w,trig};
}
function drPick(w){let x=Math.random(),sum=12;for(const s of Object.keys(w).map(Number).sort((a,b)=>a-b)){x-=w[s];if(x<=0){sum=s;break;}}
  const pairs=[];for(let a=1;a<=6;a++){const b=sum-a;if(b>=1&&b<=6)pairs.push([a,b]);}
  const [a,b]=pairs[Math.floor(Math.random()*pairs.length)];return {sum,a,b};}

const drBaseOpening=openingDice;
openingDice=function(){
  const plan=drBaseOpening();
  // Учебный круг, участок и выключенный режим — честный бросок как был.
  if(plan.lesson||S.jail>0||!CFG.DR.on)return plan;
  drLapTick();
  const d=drState();d.rolls++;
  const r=drWeights(S.pos);
  if(!r)return plan;
  const {sum,a,b}=drPick(r.w);d.guided++;
  const reach=(w,f)=>{let p=0;for(const s in w)if(f(S.tiles[(S.pos+ +s)%40]))p+=w[s];return Math.round(p*1000)/1000;};
  const isWh=t=>t.type==='wh'&&unlocked(t);
  track('dr',{trig:r.trig.join('+'),dry:d.dry,p0:reach(DR_P0,isWh),p1:reach(r.w,isWh),sum,from:S.pos});
  return {a,b,lesson:false,guided:true};
};
// Поле получает заданную пару. Если физика разошлась с предпросчётом,
// засчитывается реальный бросок: честность дороже точности.
mobileDice=async function(planned){
  document.body.classList.add('dice-rolling');
  GameFeedback.sound('throw');
  $('diceResult').hidden=true;
  try{
    const payload=planned.lesson?{lesson:true,a:planned.a,b:planned.b}:planned.guided?{guided:true,a:planned.a,b:planned.b}:{};
    const result=await MobileHost.request('roll',payload);
    if(planned.lesson&&(result.a!==planned.a||result.b!==planned.b))throw new Error('Учебный бросок не совпал с маршрутом');
    if(planned.guided&&(result.a+result.b!==planned.a+planned.b)){drState().mismatch++;track('dr_mismatch',{want:[planned.a,planned.b],got:[result.a,result.b]});}
    return {...result,lesson:!!planned.lesson};
  }finally{document.body.classList.remove('dice-rolling');}
};
const drBaseLand=land;
land=async function(t){drLapTick();drLanded(t);return drBaseLand.apply(this,arguments);};

// ===== Единый апгрейд точки (бэклог §4) =====
// Дизайн: черновики/америкэн-бой-единый-апгрейд.md. Решение 24.09: одна кнопка;
// решение 30.09: один шаг поднимает оба стата сразу (см. ниже). Уровень точки — прежний
// capLvl + salesLvl − 1 (1–7 в тире), шаги и цены те же, что у двух кнопок,
// поэтому сбор за проход, расширение и баланс не меняются. Игрок решает не
// «какой стат», а «какую точку».
// Решение продюсера 30.09.2026: один шаг поднимает оба стата сразу. Цена шага — сумма прежних
// цен запаса и продаж на этом уровне (0,5 + 0,7 = 1,2 × цена × ур.), поэтому деньги до максимума
// те же 7,2 цены точки: шагов вдвое меньше, но каждый вдвое дороже — по деньгам темп не ускорился.
// Уровень точки на карточке — 1…4; сбор за проход по-прежнему через klevel = capLvl + salesLvl − 1.
function kioskLvl(t){return Math.max(t.capLvl,t.salesLvl);}
function kioskMaxLvl(t){return Math.min(capTab(t).length,salTab(t).length);}
function kioskNextStat(t){return t.capLvl<capTab(t).length||t.salesLvl<salTab(t).length?'both':null;}
function kioskUpCost(t){return (t.capLvl<capTab(t).length?capCost(t):0)+(t.salesLvl<salTab(t).length?salesCost(t):0);}
// Значения после следующей прокачки. Карты с другой лестницей (map1.js, sf-builder.js) подменяют.
function kioskAfter(t){if(!kioskNextStat(t))return null;
  return {cap:capTab(t)[Math.min(capTab(t).length-1,t.capLvl)],sales:salesBoost(salTab(t)[Math.min(salTab(t).length-1,t.salesLvl)])};}
// Старые сохранения (чередование статов) и «грант» приводятся к равным статам:
// отстающий подтягивается к большему — разовый подарок, чтобы никто ничего не потерял.
function kioskLevelsNormalize(){
  if(!S||!S.tiles)return;
  for(const t of S.tiles){
    if(t.type!=='kiosk'||!t.owner)continue;
    const n=Math.max(t.capLvl,t.salesLvl);
    const c=Math.min(capTab(t).length,n),s=Math.min(salTab(t).length,n);
    if(t.salesLvl!==s||t.capLvl!==c){t.salesLvl=s;t.capLvl=c;}
  }
}
// Прокачка обоих статов одним шагом: списывает сумму, засчитывает задание, пишет лог.
function kioskUpgradeBoth(t){
  const cost=kioskUpCost(t);if(!kioskNextStat(t)||S.cash<cost)return false;
  track('upgrade',{tile:t.i,stat:'both',lvl:kioskLvl(t)+1,cost});
  fly('💵',AT.cash(),AT.card(),flyN(cost));S.cash-=cost;
  if(t.capLvl<capTab(t).length)t.capLvl++;if(t.salesLvl<salTab(t).length)t.salesLvl++;
  qProg('upg',1);log(`${name(t)}: точка ур. ${kioskLvl(t)} — запас ${cap(t)} шт, продажи ${sales(t)}/круг.`);
  render();draw();if(window.__kioskRedraw)window.__kioskRedraw();return true;
}
(function(){
  const base=render;
  render=function(){kioskLevelsNormalize();return base.apply(this,arguments);};
})();

let uuTile=null;
const uuBaseKiosk=kioskWindow;
kioskWindow=async function(t){uuTile=t;kioskLevelsNormalize();try{return await uuBaseKiosk.apply(this,arguments);}finally{uuTile=null;}};

function uuDots(L,max){return Array.from({length:max},(_,i)=>`<i class="${i<L?'on':''}"></i>`).join('');}
function decorateUnifiedUpgrade(){
  const card=$('card'),t=uuTile,capBtn=$('kCap'),salBtn=$('kSal'),two=card.querySelector('.shop .two');
  if(!t||!capBtn||!salBtn||!two||card.querySelector('.uup'))return;
  const L=kioskLvl(t),max=kioskMaxLvl(t),next=kioskNextStat(t),cost=kioskUpCost(t);
  const after=kioskAfter(t),profitMode=!!CFG.KIOSK.showProfit,margin=Math.max(0,sellPrice(t.good)-buyPrice(t.good));
  // Visual emphasis only: newer ladders raise both values, but the card
  // alternates one preview per step. Prices and upgrade handlers stay unchanged.
  // Один шаг поднимает оба стата — на карточке обе стрелки.
  const capChanges=!!after&&after.cap!==cap(t),salesChanges=!!after&&after.sales!==sales(t);
  const capNext=capChanges?after.cap:null,salNext=salesChanges?after.sales:null;
  const row=(label,now,nx)=>`<span class="uup-stat${nx!==null?' grows':''}"><small>${label}</small><b>${now}</b>${nx!==null?`<i>→</i><b class="up">${nx}</b>`:''}</span>`;
  const dS=salNext!==null?salNext-sales(t):0,dC=capNext!==null?capNext-cap(t):0;
  const gain=[dC?`+${dC} мест`:'',dS?(profitMode?`+$${dS*margin} за круг`:`+${dS} ${dS===1?'продажа':'продажи'} за круг`):''].filter(Boolean).join(' · ');
  const salesRow=profitMode?row('Прибыль за круг','$'+sales(t)*margin,salNext!==null?'$'+salNext*margin:null):row('Продажи за круг',sales(t),salNext);
  const block=document.createElement('div');block.className='uup';
  block.innerHTML=`${next?`<div class="uup-stats">${row('Запас',cap(t),capNext)}${salesRow}</div>`:''}
    ${next?`<button class="ok uup-btn" id="kUp" ${S.cash<cost?'disabled':''}><span>Улучшить<small>${gain}</small></span><b>$${cost}</b></button>`:`<p class="uup-max">Прокачка на максимуме.${evolveState(t)==='max'?'':' Дальше — улучшение ниже.'}</p>`}`;
  two.replaceWith(block);
  // Один индикатор уровня в шапке; повтор в блоке улучшений не нужен.
  const lvl=card.querySelector('.shop .srow .lvl');if(lvl){lvl.textContent=`${L}/${max}`;lvl.setAttribute('aria-label',`Уровень ${L} из ${max}`);}
  const up=$('kUp');
  // Кнопка вызывает прежний обработчик нужного стата: он списывает цену,
  // засчитывает задание «прокачай», пишет лог и перерисовывает окно.
  if(up)up.onclick=()=>{if(kioskNextStat(t)==='both')kioskUpgradeBoth(t);else{const n=kioskNextStat(t);if(!n||S.cash<kioskUpCost(t))return;(n==='sales'?salBtn:capBtn).onclick();}};
  if(typeof enamelButton==='function'&&up)enamelButton(up);
  if(typeof cashGlyph==='function')cashGlyph(block);
}
new MutationObserver(()=>decorateUnifiedUpgrade()).observe($('card'),{childList:true,subtree:true});

// ===== Страховка учебного круга: деньги на обязательные шаги нельзя потратить =====
// Правила: черновики/америкэн-бой-тутор-правила.md. Проверка: node tests/tutorial-guard.cjs.
// Учебный круг (FIRST_LAP_ROUTES) требует три покупки: точка на первой клетке,
// хотя бы один товар на Costco, бизнес на третьей. Всё, что не требуется, пока
// шаги не пройдены, либо заперто (прокачки), либо ограничено резервом (закупка).
// Резерв — сумма цен ещё не сделанных обязательных покупок; касса ниже резерва
// опуститься не может. Баланс первого круга может меняться — правило остаётся.

// Сколько денег нельзя тратить прямо сейчас.
function tutorialReserve(){
  if(typeof firstLapActive!=='function'||!S||!firstLapActive())return 0;
  const p=firstLapPlan(),i=S.firstRoute.index||0;let r=0;
  const k=S.tiles[p[0]];if(i<=0&&k&&k.type==='kiosk'&&!k.owner)r+=k.price;
  if(i<=1&&!myKiosks().some(x=>x.goods>0)){const gs=CFG.GOODS.filter(g=>g.zone===0);if(gs.length)r+=Math.min(...gs.map(g=>buyPrice(g.id)));}
  const b=S.tiles[p[2]];if(i<=2&&b&&b.type==='biz'&&!b.owner)r+=b.price;
  return r;
}
// Обязательные шаги ещё идут — необязательные траты заперты.
function tutorialLocked(){return tutorialReserve()>0;}
// Что ещё осталось купить по маршруту — для подписи на замке.
function tutorialLeft(){
  if(!tutorialLocked())return [];const p=firstLapPlan(),i=S.firstRoute.index||0,out=[];
  const k=S.tiles[p[0]];if(i<=0&&k&&!k.owner)out.push('точку');
  if(i<=1&&!myKiosks().some(x=>x.goods>0))out.push('товар на Costco');
  const b=S.tiles[p[2]];if(i<=2&&b&&!b.owner)out.push('бизнес');
  return out;
}
// Можно ли потратить сумму, не тронув резерв.
function tutorialCanSpend(cost){return S.cash-cost>=tutorialReserve();}

// Закупка: все пути покупки товара идут через addGoods — здесь и держим резерв.
(function(){
  const base=addGoods;
  addGoods=function(g,n){
    const r=tutorialReserve();if(r>0){const p=buyPrice(g);n=Math.max(0,Math.min(n,Math.floor((S.cash-r)/p)));if(n<=0)return 0;}
    return base.call(this,g,n);
  };
})();

// Прокачки точки и бизнеса на учебном круге заперты с пояснением.
function tutorialLockButtons(){
  if(!tutorialLocked())return;
  const card=$('card');if(!card)return;
  for(const id of ['kUp','kCap','kSal','bUp','kEvo','bEvo']){
    const b=card.querySelector('#'+id);if(!b||b.dataset.tutLocked)continue;
    b.dataset.tutLocked='1';b.disabled=true;b.setAttribute('aria-disabled','true');
    const left=tutorialLeft();
    const label=b.querySelector('span:not(.enamel-skin)')||b;label.textContent='Сначала — '+(left[left.length-1]||'маршрут');
    const bEl=b.querySelector('b');if(bEl)bEl.remove();
  }
  if(!card.querySelector('.tut-lock-note')&&card.querySelector('[data-tut-locked]')){
    const left=tutorialLeft();
    const n=document.createElement('p');n.className='tut-lock-note';n.textContent=`Прокачка откроется, когда купишь ${left.join(' и ')} по маршруту — деньги отложены на это.`;
    card.querySelector('[data-tut-locked]').after(n);
  }
  // Costco: «на всё» не должно опускать кассу ниже резерва — кнопка остаётся, но addGoods режет.
  const all=card.querySelector('#wAll');
  if(all&&!all.dataset.tutNote){all.dataset.tutNote='1';const r=tutorialReserve();const note=document.createElement('small');note.className='tut-lock-note';note.textContent=`$${r} отложено на бизнес по маршруту`;all.after(note);}
}
new MutationObserver(()=>tutorialLockButtons()).observe($('card'),{childList:true,subtree:true});
window.TutorialGuard={reserve:tutorialReserve,locked:tutorialLocked,canSpend:tutorialCanSpend,left:tutorialLeft};

// ===== Умная закупка на складе: одна функция для «Пополнить всё» и «Половина суммы» =====
// Правило продюсера 30.09.2026: закупка должна быть максимально эффективной — за наименьшее число
// проходов старта принести наибольшую прибыль на каждый вложенный доллар, с учётом уже лежащего
// товара, числа и уровня точек, акций (тренд, чёрная пятница — внутри sellPrice) и бустов (boostOf).
// Как: план строится кругами продаж. На каждом круге каждой точке — столько штук, сколько она
// продаст за круг (не больше свободного места), в порядке прибыли на доллар закупки.
// Пока первый круг не обеспечен у всех выгодных точек, второй не закупается.
function restockPlan(budget){
  const reserve=window.TutorialGuard?TutorialGuard.reserve():0;
  let left=Math.max(0,Math.min(budget,S.cash-reserve)),spent=0;
  const plan=new Map();
  const ks=myKiosks().filter(t=>cap(t)-t.goods>0);
  const value=t=>{const p=buyPrice(t.good),v=sellPrice(t.good)*boostOf(t)-p;return {p,v,q:p>0?v/p:0};};
  for(let lap=0;lap<60&&left>0;lap++){
    const need=ks.map(t=>{const x=value(t);return {t,...x,n:Math.min(sales(t),cap(t)-t.goods-(plan.get(t)||0))};})
      .filter(x=>x.n>0&&x.v>0).sort((a,b)=>b.q-a.q||b.v-a.v);
    if(!need.length)break;let any=false;
    for(const x of need){while(x.n>0&&left>=x.p){plan.set(x.t,(plan.get(x.t)||0)+1);left-=x.p;spent+=x.p;x.n--;any=true;}}
    if(!any)break;
  }
  return {plan,spent};
}
function smartRestock(budget){
  const {plan,spent}=restockPlan(budget);
  for(const [t,n] of plan)t.goods+=n;
  S.cash-=spent;
  if(spent>0)track('restock',{spent,points:plan.size,units:[...plan.values()].reduce((a,b)=>a+b,0)});
  return spent;
}
window.Restock={plan:restockPlan,run:smartRestock};

// ===== Инспектор: клетка 5 рассылает проверки на точки и бизнесы игрока =====
// Правила: черновики/америкэн-бой-инспектор.md. Решение продюсера 27.09.2026:
// из клетки вылетают 1–3 проверки, садятся на клетки; пока проверка висит —
// точка не работает на игрока (нет продаж за круг, нет сбора за проход).
// Остановился на клетке — попап как в ментовке: заплатить или ловить дубль.
// На поле не больше трёх проверок за раз. Карта 1 клетки инспектора не имеет.
CFG.INSP={limit:3,attempts:3,fineShare:0.5,steps:[3,7],fromLap:5,lapStep:3}; // штраф = доля полицейского штрафа; steps: до 3 своих клеток — 1 проверка, до 7 — 2, дальше — 3

function inspActive(){return S.tiles.filter(t=>t.insp);}
// Потолок проверок считается по своим клеткам: в мультиплеере проверка на точке соперника (rival) — его забота,
// иначе чужая проверка съедала единственный слот и инспектор уходил с «все три уже идут» (плейтест 03.10).
function inspMine(){return S.tiles.filter(t=>t.insp&&!t.rival);}
function inspFine(){return Math.max(10,Math.round(policeFine()*CFG.INSP.fineShare/10)*10);}
function inspWorks(t){return !t.insp;} // точка работает на игрока
function inspLabel(t){return t.type==='biz'?'бизнес не платит':'точка не торгует';}

// Клетка 🌪 стала инспектором: вместо неприятностей — проверки.
hazard=async function(){
  // Плейтест 01.10: проверки в первом круге останавливали весь бизнес. Инспектор не приезжает до 5-го круга,
  // потом дозированно: одна проверка, каждые 3 круга потолок растёт на одну (правило «одна механика за раз»).
  const lapsDone=S.laps||0;
  if(lapsDone<CFG.INSP.fromLap){toast(`📋 Мэрия ещё не прислала инспектора — до ${CFG.INSP.fromLap}-го круга проверок нет`);log(`📋 Клетка инспектора: проверки начнутся с ${CFG.INSP.fromLap}-го круга.`);return;}
  // Мультиплеер (01.10): вместо кругов — порог по владениям (CFG.INSP.minOwn, точки и бизнесы вместе).
  const ownNow=S.tiles.filter(t=>(t.type==='kiosk'||t.type==='biz')&&t.owner&&unlocked(t)).length;
  if(ownNow<(CFG.INSP.minOwn||0)){toast(`📋 Инспектору пока некого проверять — проверки с ${CFG.INSP.minOwn} владений`);log(`📋 Клетка инспектора: проверки начнутся с ${CFG.INSP.minOwn} владений.`);return;}
  const lapCap=1+Math.floor(Math.max(0,lapsDone-CFG.INSP.fromLap)/CFG.INSP.lapStep);
  const busy=inspMine().length,cap=Math.min(CFG.INSP.limit,lapCap),free=cap-busy;
  if(free<=0){const k=busy===1?'проверка':busy<5?'проверки':'проверок',w=busy===1?'идёт':'идут';
    toast(busy>=CFG.INSP.limit?`📋 Инспектор: все ${busy} ${k} уже ${w}`:`📋 Инспектор: у тебя уже ${w} ${busy} ${k} — больше пока не положено`);
    log(`📋 Инспектор приходил, но у тебя уже ${busy} ${k} из ${cap} возможных — ушёл.${cap<CFG.INSP.limit?` Потолок растёт на одну каждые ${CFG.INSP.lapStep} круга.`:''}`);return;}
  const fit=t=>(t.type==='kiosk'||t.type==='biz')&&unlocked(t)&&!t.insp&&!t.rival&&t.i!==S.pos;
  let spots=S.tiles.filter(t=>fit(t)&&t.owner);
  if(!spots.length)spots=S.tiles.filter(t=>fit(t)&&!t.owner&&!t.drop);
  if(!spots.length){toast('📋 Инспектору некого проверять');return;}
  spots.sort(()=>Math.random()-0.5);
  // Решение продюсера 30.09.2026: проверок столько, сколько «заслужил» размер бизнеса, а не случайно 1–3:
  // до 3 своих клеток — одна, до 7 — две, дальше — три. Три инспектора в начале карты ломали прохождение.
  const own=S.tiles.filter(t=>(t.type==='kiosk'||t.type==='biz')&&t.owner&&unlocked(t)).length;
  const want=1+CFG.INSP.steps.filter(x=>own>x).length;
  const n=Math.min(free,spots.length,want);
  const plan=spots.slice(0,n).map(t=>({t,drop:{insp:1},icon:'📋'}));
  toast(`📋 Инспектор разослал ${n} ${n===1?'проверку':'проверки'}`);
  track('inspector',{n,tiles:plan.map(p=>p.t.i)});
  await flyDrops(plan);
  // Полёт отыгран через drop; сама проверка живёт во флаге клетки, чтобы её не «подобрали» как находку.
  plan.forEach(p=>{if(p.t.drop&&p.t.drop.insp){delete p.t.drop.insp;if(!Object.keys(p.t.drop).length)p.t.drop=null;}p.t.insp=true;});
  log(`📋 Инспектор: проверки на ${plan.map(p=>name(p.t)).join(', ')}. Пока не снял — ${n===1?'точка не работает':'точки не работают'}.`);
  save();render();
};

function inspClear(t,how){
  t.insp=false;if(S.insp&&S.insp.i===t.i)S.insp=null;
  if(typeof inspCardUnlock==='function')inspCardUnlock(); // карточка возвращается в обычный вид, откуда бы ни сняли проверку
  float(t.i,'✅ проверка снята','#8bc34a',1.2);
  log(`📋 ${name(t)}: ${how}, проверка снята — ${t.type==='biz'?'бизнес снова платит':'точка снова торгует'}.`);
}

// Попап на клетке с проверкой — ровно как в участке: заплатить, откупиться или дубль.
async function inspectorPopup(t){
  const fine=inspFine(),take=fineTake(fine);
  const v=await modal(AuthorityWindows.html('inspector',{fine,take,label:t.type==='biz'?'Бизнес':'Проверка торговой точки'}),
    [{t:`<span>${S.cash>=take?'Заплатить':'В минус'}</span><span class="action-price">$${take}</span>`,v:1,cls:'ok'},{t:`<span>Откупиться</span><span class="action-price">💎 ${CFG.HARD.bail}</span>`,v:3,cls:'hard',dis:S.hard<CFG.HARD.bail},{t:'Ловить дубль',v:0,cls:'bad'}],{sticky:true});
  inspectorResolve(t,v,fine);
}
// Выбор игрока — один и тот же из попапа и из карточки точки: 1 — заплатить, 3 — 💎, 0 — дубль.
function inspectorResolve(t,v,fine){
  fine=fine||inspFine();
  track('inspection',{tile:t.i,choice:v===3?'bail':v===1?'pay':'roll',fine});
  if(v===3){if(!spendHard(CFG.HARD.bail,AT.tile(t.i)))return;inspClear(t,`откупился за 💎 ${CFG.HARD.bail}`);}
  else if(v===1){payFine(fine);inspClear(t,`заплатил $${fine}`);}
  else if(!S.insp){S.insp={i:t.i,left:CFG.INSP.attempts,fine};log(`📋 ${name(t)}: споришь с инспектором — ${CFG.INSP.attempts} попытки на дубль.`);hint('insp','Кнопка «Бросить» ловит дубль. Три промаха — штраф спишется сам.');}
  inspCardUnlock();save();render();
}

// Остановка на клетке с проверкой: сначала инспектор, потом обычная остановка.
(function(){const base=land;land=async function(t){
  if(t&&t.insp&&unlocked(t)&&!S.insp){await inspectorPopup(t);}
  return base.apply(this,arguments);
};})();

// Спор с инспектором: бросок ловит дубль, фишка стоит на месте.
// Оборачиваем prototypeRoll, а не roll: кнопка броска привязана к roll ещё при загрузке
// ($('bRoll').onclick=roll), и подмена roll до неё не доходила — бросок шёл как обычный,
// фишка уезжала, а спор и надпись «дубль?» висели навсегда. roll зовёт prototypeRoll
// по имени на каждом броске, так что эта обёртка срабатывает всегда.
// Кубики — через mobileDice, как в участке: засчитывается то, что выпало на поле.
(function(){const base=prototypeRoll;prototypeRoll=async function(){
  if(!S.insp)return base.apply(this,arguments);
  const t=S.tiles[S.insp.i];
  // Спор идёт только на своей клетке. Фишка ушла (старые сохранения с этой ошибкой) —
  // спор снимаем, проверка остаётся висеть на клетке, бросок обычный.
  if(!t||!t.insp||S.pos!==S.insp.i){S.insp=null;render();return base.apply(this,arguments);}
  if(moving||S.finished)return;
  refillStarter();if(S.rolls<=0)return overtimeOffer();
  S.rolls--;moving=true;hideTip();render();
  const {a,b}=typeof mobileDice==='function'?await mobileDice(openingDice()):openingDice(),dbl=a===b;
  if(dbl){toast(`🎲 ${a} + ${b} — дубль! Инспектор ушёл ни с чем.`);inspClear(t,'выбросил дубль');}
  else{S.insp.left--;
    if(S.insp.left>0){toast(`🎲 ${a} + ${b} — не дубль. Осталось попыток: ${S.insp.left}`);log(`📋 Спор с инспектором: не дубль, ход потерян. Попыток: ${S.insp.left}.`);}
    else{const before=S.cash;payFine(S.insp.fine);const m=before-S.cash;toast(`🎲 ${a} + ${b} — инспектор выписал штраф $${m}`+(S.cash<0?', ты в минусе':''));inspClear(t,`штраф $${m} после трёх промахов`);}}
  await wait(400);moving=false;refillStarter();save();render();
  if(S.rolls<=0&&!S.finished)setTimeout(()=>{if(!moving)overtimeOffer();},400);
};})();

// Кнопка броска в режиме спора выглядит как в участке; карточка точки говорит, что она стоит.
(function(){const base=render;render=function(){
  const r=base.apply(this,arguments);
  try{
    const b=$('bRoll');if(b)b.classList.toggle('jail',S.jail>0||!!S.insp);
  }catch(e){}
  inspCardNote();
  return r;
};})();
// Подпись в карточке точки: встаёт после строки с названием (.srow) или заголовка.
function inspCardNote(){
  const card=$('card'),t=S&&S.tiles[S.pos];
  if(!card||card.hidden||!t||!t.insp||card.querySelector('.insp-quote,[data-authority]'))return; // в самом попапе плашка не нужна
  // Только карточка точки/бизнеса: иначе замок гасил кнопки любого окна, открытого
  // на проверяемой клетке (настройки аккаунта, магазин, справка).
  const body=card.querySelector('.property-body');if(!body)return;
  inspCardLock(card,t);
  if(card.querySelector('.insp-note'))return;
  const fine=inspFine(),arguing=S.insp&&S.insp.i===t.i;
  const n=document.createElement('div');n.className='insp-note';
  n.innerHTML=`<p class="insp-head"><i class="insp-ic" aria-hidden="true"></i><span><b>Идёт проверка</b> — ${inspLabel(t)}.<small>${arguing?`Споришь: осталось попыток на дубль — ${S.insp.left}`:'Откупись или лови дубль — как в участке'}</small></span></p>
    <div class="insp-actions">
      <button class="ok insp-btn" data-v="1">${S.cash>=fine?'Заплатить':'В минус'} $${fine}</button>
      <button class="hard insp-btn" data-v="3" ${S.hard<CFG.HARD.bail?'disabled':''}>Откупиться 💎 ${CFG.HARD.bail}</button>
      ${arguing?'':'<button class="bad insp-btn" data-v="0">Ловить дубль</button>'}
    </div>`;
  n.querySelectorAll('.insp-btn').forEach(b=>{b.onclick=()=>{if(!t.insp)return;inspectorResolve(t,+b.dataset.v,fine);};});
  if(typeof enamelButton==='function')n.querySelectorAll('.insp-btn').forEach(b=>enamelButton(b)); // печатные кнопки игры
  if(typeof cashGlyph==='function')cashGlyph(n);
  body.append(n);
}
// Пока идёт проверка: инспектор перекрывает половину картинки, все кнопки карточки заперты,
// кроме крестика и действий инспектора — как в участке.
let inspArtMissing=false;
function inspCardLock(card,t){
  const pic=card.querySelector('.property-picture');
  // Картинка в карточке тянется на свободное место (flex: 1 1 180px; height: 0). Без блоков
  // товара она бы выросла или схлопнулась — фиксируем высоту обычного вида до скрытия блоков.
  const h=pic&&!pic.dataset.inspH?pic.offsetHeight:0;
  if(h>0){pic.style.setProperty('--insp-pic-h',h+'px');pic.dataset.inspH=h;}
  if(pic&&!inspArtMissing&&!pic.querySelector('.insp-overlay')){
    const o=document.createElement('div');o.className='insp-overlay';o.setAttribute('aria-hidden','true');
    // Обработчик в JS: атрибут onerror в этой разметке не срабатывал — оставался значок битой картинки.
    // Нет картинки — запоминаем: иначе удаление оверлея будит наблюдатель карточки и запрос идёт по кругу.
    const img=new Image();img.alt='';img.onerror=()=>{inspArtMissing=true;o.remove();};img.src='assets/ui/inspector-angry.webp';o.append(img);
    pic.append(o);
  }
  card.querySelectorAll('.property-body > .box, .property-body > .uup, .property-body > .rows, .property-actions').forEach(e=>{if(e.classList.contains('insp-note'))return;e.classList.add('insp-hidden');});
  card.querySelectorAll('button:not(.xclose):not(#xNo):not(.insp-btn)').forEach(b=>{if(b.dataset.inspLocked)return;b.dataset.inspLocked=b.disabled?'was':'1';b.disabled=true;b.setAttribute('aria-disabled','true');});
}
function inspCardUnlock(){
  const card=$('card');if(!card)return;
  card.querySelectorAll('[data-insp-locked]').forEach(b=>{if(b.dataset.inspLocked==='1'){b.disabled=false;b.removeAttribute('aria-disabled');}delete b.dataset.inspLocked;});
  card.querySelectorAll('.insp-hidden').forEach(e=>e.classList.remove('insp-hidden'));
  card.querySelectorAll('.insp-overlay,.insp-note').forEach(e=>e.remove());
  card.querySelectorAll('.property-picture[data-insp-h]').forEach(p=>{delete p.dataset.inspH;p.style.removeProperty('--insp-pic-h');});
}
new MutationObserver(()=>inspCardNote()).observe($('card'),{childList:true,subtree:true});
window.Inspector={active:inspActive,fine:inspFine,works:inspWorks,resolve:inspectorResolve};

// ===== Инкассатор: мешок лопается всегда, даже когда свободных клеток нет =====
// Решение продюсера 28.09.2026: раньше при полностью выкупленном поле клетка 🚚 вместо
// разлёта вешала ×1,5 на точки (boostRain). Теперь монеты разлетаются в любом случае —
// сначала на закрытые клетки, если их мало — на любые точки и бизнесы, включая свои и чужие.
scatter=async function(){
  const c=CFG.SCATTER,sc=S.day;
  const ok=t=>t.i!==S.pos&&t.i!==0&&!t.drop;
  let spots=S.tiles.filter(t=>!unlocked(t)&&ok(t));
  if(spots.length<c.drops){
    const more=S.tiles.filter(t=>unlocked(t)&&ok(t)&&(t.type==='kiosk'||t.type==='biz'));
    more.sort(()=>Math.random()-0.5);
    spots=spots.concat(more.slice(0,c.drops-spots.length));
  }
  spots.sort(()=>Math.random()-0.5);
  let money=0,n=0,rollsN=0,hardN=0;const plan=[];
  spots.slice(0,c.drops).forEach(t=>{const r=Math.random();
    if(r<c.hardChance){plan.push({t,drop:{hard:1},icon:'💎'});hardN++;}
    else if(r<c.hardChance+c.rollsChance){plan.push({t,drop:{rolls:2},icon:'🎲'});rollsN++;}
    else{const m=(c.min+Math.floor(Math.random()*(c.max-c.min)))*sc;plan.push({t,drop:{cash:m},icon:'🪙'});money+=m;}
    n++;});
  if(!plan.length){toast('🚚 Инкассатор проехал мимо — кидать некуда');return;}
  toast(`🚚 Мешок лопнул! $${money} разлетелось по району`);
  track('scatter',{n,money,rolls:rollsN,hard:hardN});
  await flyDrops(plan);
  log(`🚚 Инкассатор растерял мешок: $${money}${rollsN?', '+rollsN+'×🎲':''}${hardN?', '+hardN+'×💎':''} разлетелось по ${n} клеткам. Забираешь, когда останавливаешься.`);render();
};

// ===== Бруклин (карта 5) на новой лестнице =====
// Спек: черновики/америкэн-бой-карты-и-дерево.md §2, §3, §6; решение 25.09 — перевести.
// Прежняя структура прототипа сохраняется: у линии три товара (tier, next), смена
// товара — прежнее «расширение» с дневными ограничениями TIER_DAY. Меняется:
//  • товары — 6 категорий × 3 товара (Брайтон: напитки, сладости; Кони: одежда,
//    обувь; Манхэттен: аудио, видео);
//  • внутри товара 16 уровней = 4 формата × 4; одна прокачка — +1 продажа за круг
//    и +4 места (запас = 4 круга продаж); уровень G сквозной: 16·(товар−1)+уровень;

CFG.PUSH={on:true,quietFrom:22,quietTo:9,minAwayMin:30,maxPerDay:2};
const PUSH_TEXTS=[

let pushTimer=null;
function pushState(){if(!S.push)S.push={asked:false,optIn:false,day:0,sent:0};return S.push;}
function rollsFullInMs(){
  if(S.rolls>=CFG.ROLLS_PER_DAY)return 0;

  return nextRollIn()+(CFG.ROLLS_PER_DAY-S.rolls-1)*step;
}
// Тихие часы: пуш, выпавший на ночь, переносится на утро.
function pushFireAt(ms){
  const at=new Date(Date.now()+ms),h=at.getHours(),q=CFG.PUSH;
  if(h>=q.quietFrom||h<q.quietTo){
    const m=new Date(at);if(h>=q.quietFrom)m.setDate(m.getDate()+1);m.setHours(q.quietTo,0,0,0);return m.getTime()-Date.now();
  }
  return ms;
}
function schedulePush(){
  clearTimeout(pushTimer);pushTimer=null;
  const p=pushState();
  if(!CFG.PUSH.on||!p.optIn||S.finished||typeof Notification==='undefined'||Notification.permission!=='granted')return;
  const full=rollsFullInMs();
  if(full<CFG.PUSH.minAwayMin*60000)return; // почти полные — игрок и так рядом
  const wait=pushFireAt(full);
  pushTimer=setTimeout(()=>{
    const p=pushState();if(p.day!==S.day){p.day=S.day;p.sent=0;}
    if(p.sent>=CFG.PUSH.maxPerDay||!document.hidden)return;
    p.sent++;save();
    const text=PUSH_TEXTS[Math.floor(Math.random()*PUSH_TEXTS.length)].replaceAll('{n}',CFG.ROLLS_PER_DAY);
    try{const n=new Notification('Америкэн бой',{body:text,icon:'icon.png',tag:'rolls-full'});n.onclick=()=>{window.focus();track('push_open',{kind:'rolls_full'});n.close();};}catch(e){}
    track('push_sent',{kind:'rolls_full',delayMin:Math.round(wait/60000)});
  },wait);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)schedulePush();else{clearTimeout(pushTimer);pushTimer=null;}});

// The same unlock transaction is used by every branch and by regression tests.
function metaUnlock(mapNo,id){
  const m=metaState(),step=META.steps.find(s=>s.after===mapNo);
  if(m.map!==mapNo||!step?.nodes.some(n=>n.id===id)||m.owned.includes(id)||m.pp<1)return false;
  m.pp--;m.owned.push(id);track('tree_node',{node:id,map:mapNo});save();return true;
}
function metaFinish(mapNo){
  const m=metaState(),step=META.steps.find(s=>s.after===mapNo);
  m.settled=m.settled||[];if(m.settled.includes(mapNo))return false;
  const cash=Math.max(0,Math.round(S.cash)),rolls=Math.min(META.rollsCap,Math.floor(cash/META.cashPerRoll));
  S.rolls+=rolls;S.cash-=rolls*META.cashPerRoll;
  if(step)m.pp+=Math.max(0,step.nodes.filter(n=>!m.owned.includes(n.id)).length-m.pp);
  m.map=mapNo;m.settled.push(mapNo);save();render();return true;
}

function chanceL(){
  const k=myKiosks().reduce((a,t)=>a+Math.min(t.goods||0,sales(t))*Math.max(0,sellPrice(t.good)-buyPrice(t.good)),0);
  const b=S.tiles.filter(t=>t.type==='biz'&&t.owner&&unlocked(t)).reduce((a,t)=>a+fee(t),0);
  return Math.max(30,Math.round((k+b)/5)*5);
}

  return {units,cash};}

const chanceCard=id=>CHANCE_LIB.find(c=>c.id===id);

// Этапы ввода (§8, ob-*): что в коллекции и как собирается колода.
var CHANCE_STAGES={
  1:{own:['stash','coffee','wholesale','cab'],copies:2,manual:false},
  2:{own:['stash','coffee','wholesale','cab','freegoods','grant','supplier','collector'],copies:1,manual:false},
  3:{own:['stash','coffee','wholesale','cab','freegoods','grant','supplier','collector'],copies:1,manual:false,reveal:true},
  4:{own:['stash','coffee','wholesale','cab','freegoods','grant','supplier','collector','sellout','reprice','alibi','sure','double'],copies:1,manual:true},
  5:{own:CHANCE_LIB.filter(c=>c.r!=='gold').map(c=>c.id),copies:1,manual:true},

const CHANCE_DECK_SIZE=8,CHANCE_MAX_COPIES=2,CHANCE_MAX_GOLD=2;
const CHANCE_EV={stash:.68,coffee:.60,wholesale:.55,cab:.55,freegoods:1,grant:.9,supplier:.8,collector:.75,sellout:1.15,reprice:.75,alibi:.6,sure:.7,double:.5,jackpot:1.75,investor:1,credit:.8};

function chanceStage(){return typeof MAP1!=='undefined'&&MAP1?1:(S.chanceStage||5);}
function chanceState(){
  if(!S.chance)S.chance={collection:{},deck:null,bag:[],fx:{},seen:{}};
  const c=S.chance,st=CHANCE_STAGES[chanceStage()];
  const added=[];
  for(const id of st.own)if(!c.collection[id]){c.collection[id]=st.copies;added.push(id);}
  if(added.length)setTimeout(()=>chanceEmitAdded(added),0); // после сохранения состояния, вне текущего рендера
  return c;
}
function chanceRecommended(){
  const stage=chanceStage(),st=CHANCE_STAGES[stage],c=chanceState();
  if(stage===1)return st.own.flatMap(id=>[id,id]);
  if(!st.manual)return st.own.slice();
  const pool=Object.keys(c.collection).filter(id=>chanceCard(id)&&!(chanceCard(id).bankOnly&&!S.tiles.some(t=>t.type==='bank')));
  // Рекомендованная колода — надёжная: без фиолетовых и золотых, по ценности «наугад».
  const safe=pool.filter(id=>['grey','blue'].includes(chanceCard(id).r)).sort((a,b)=>CHANCE_EV[b]-CHANCE_EV[a]);
  const deck=[];for(const id of safe)for(let k=0;k<Math.min(CHANCE_MAX_COPIES,c.collection[id]);k++)deck.push(id);
  let i=0;while(deck.length<CHANCE_DECK_SIZE&&safe.length){deck.push(safe[i%safe.length]);i++;}

}
function chanceDeckCheck(ids){
  if(!Array.isArray(ids)||ids.length!==CHANCE_DECK_SIZE)return `Нужно ровно ${CHANCE_DECK_SIZE} карт`;
  const c=chanceState(),n={};
  for(const id of ids){const card=chanceCard(id);if(!card)return `Нет карты ${id}`;n[id]=(n[id]||0)+1;
    if(n[id]>CHANCE_MAX_COPIES)return `Не больше ${CHANCE_MAX_COPIES} копий одной карты`;
    if(!c.collection[id])return `Карты «${card.title}» нет в коллекции`;
    if(n[id]>c.collection[id])return `Не хватает копий «${card.title}»`;
    if(card.bankOnly&&(chanceStage()<5||!S.tiles.some(t=>t.type==='bank')))return 'Кредит доступен только на карте с банком';
    if((card.r==='purple'&&chanceStage()<4)||(card.r==='gold'&&chanceStage()<5))return 'Эта редкость ещё не открыта';}
  if(ids.filter(id=>chanceCard(id).r==='gold').length>CHANCE_MAX_GOLD)return `Золотых — не больше ${CHANCE_MAX_GOLD}`;

function chanceDeck(){const c=chanceState(),st=CHANCE_STAGES[chanceStage()];return st.manual&&c.deck&&!chanceDeckCheck(c.deck)?c.deck:chanceRecommended();}
// «Мешок»: каждая карта выходит один раз за цикл, потом колода перемешивается.
function chanceDraw(){
  const c=chanceState(),deck=chanceDeck(),key=chanceStage()+':'+deck.join(',');
  if(c.bagKey!==key){c.bag=[];c.bagKey=key;}
  if(!c.bag.length){c.bag=chanceDeck().slice();for(let i=c.bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c.bag[i],c.bag[j]]=[c.bag[j],c.bag[i]];}}

}
function chanceSpinParams(card){const r=CHANCE_RARITY[card.r],fx=chanceFx();

function chanceRotor(p,random=Math.random){
  let angle=0,speed=p.deg,braking=false,elapsed=0,start=0,distance=0,duration=0;
  const side=()=>{const a=((angle%360)+360)%360;return a<90||a>=270?'A':'B';};
  return {
    get angle(){return angle;},get stopped(){return braking&&elapsed>=duration;},side,
    brake(){if(braking)return;distance=p.stopDeg*(1-p.jitter+random()*2*p.jitter);

async function chanceResolve(card,side){

}

// Эффекты в экономике: цены закупки и продажи, заморозка, отмазка, счёт кругов.
(function(){

    if((effect.category||good(effect.good).cat||effect.good)!==(good(g).cat||g))return p;

// ---------- экран 1: показ и вращение ----------
Chance.present=async function(card){
  await rarityIntro(card);
  const p=Chance.spinParams(card);
  return new Promise(resolve=>{
    const el=document.createElement('div');el.className='cu-layer cu-play r-'+card.r;
    const plate=s=>`<div class="cu-opt ${s} ${s==='B'&&badB(card)?'bad':''}" data-side="${s}"><span class="cu-opt-ic">${ICONS[card.id][s==='A'?0:1]}</span><span><b>${s}</b> ${card[s]}</span></div>`;
    el.innerHTML=`<div class="cu-play-in">
      <header class="cu-head"><h2>Шанс</h2>
        ${p.double?'<span class="cu-flag x2">×2 — и плюс, и минус</span>':''}${p.forced?'<span class="cu-flag sure">Верняк: выпадет A</span>':''}</header>
      <div class="cu-stage" id="cuStage" aria-hidden="true"><span class="cu-rays"></span><span class="cu-shadow"></span>${cardHTML(card,'cu-big')}</div>
      <div class="cu-opts">${plate('A')}${plate('B')}</div>
      <p class="cu-hint" id="cuHint" role="status">Жми, когда к тебе повернётся нужная сторона</p>
      <button class="bad cu-stop" id="cuStop">Стоп!</button>
      <button class="ok cu-take" id="cuTake" hidden>Забрать</button>
    </div>`;
    el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Шанс: '+card.title);
    const game=document.getElementById('app'),wasInert=game?.inert,focusBefore=document.activeElement;if(game)game.inert=true;
    document.body.classList.add('chance-playing');document.body.append(el);
    ['cuStop','cuTake'].forEach(id=>enamelButton($(id)));
    const cardEl=el.querySelector('.cu-big'),spinEl=cardEl.querySelector('.cu-spin'),shadow=el.querySelector('.cu-shadow');
    let ang=0,last=performance.now(),stopping=false,side=null,done=false,activeMs=0,claiming=false;const rotor=Chance.rotor(p);
    const pause=()=>{last=performance.now();};document.addEventListener('visibilitychange',pause);
    const finish=()=>{document.removeEventListener('visibilitychange',pause);if(game)game.inert=wasInert;document.body.classList.remove('chance-playing');el.remove();if(focusBefore?.isConnected)focusBefore.focus({preventScroll:true});resolve(side);};
    el.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();(done?$('cuTake'):$('cuStop')).focus({preventScroll:true});}});
    $('cuStop').focus({preventScroll:true});
    // вход: карта вылетает из колоды и шлёпается со сжатием
    if(!reduced())cardEl.animate([{transform:'translateY(120px) scale(.4) rotate(-12deg)',opacity:0},{transform:'translateY(-18px) scale(1.06,.94)',opacity:1,offset:.6},{transform:'translateY(4px) scale(.97,1.04)',offset:.8},{transform:'none'}],{duration:480,easing:'cubic-bezier(.3,.7,.3,1)'});
    snd('throw');
    const stop=()=>{if(stopping||done)return;stopping=true;
      rotor.brake();$('cuStop').disabled=true;$('cuHint').textContent='Тормозит…';
      // кнопка вдавливается — упреждение
      if(!reduced())$('cuStop').animate([{scale:1},{scale:.94},{scale:1}],{duration:160});
      snd('ui');};
    el.querySelector('#cuStage').onclick=stop;$('cuStop').onclick=stop;
    const land=()=>{done=true;
      side=rotor.side();cardEl.dataset.result=side;
      const good=side==='A',bad=side==='B'&&badB(card);
      el.classList.add('landed',good?'win-a':bad?'win-bad':'win-b');
      el.querySelector(`.cu-opt[data-side="${side}"]`).classList.add('hit');
      el.querySelector(`.cu-opt[data-side="${side==='A'?'B':'A'}"]`).classList.add('miss');
      $('cuHint').textContent=good?'Выпало A':'Выпало B';
      $('cuStop').hidden=true;const take=$('cuTake');take.hidden=false;
      // вспышка стороны и лёгкое покачивание вокруг итогового угла — сторона не меняется
      // Сторона уже решена углом остановки. Карта «плюхается» лицом этой же
      // стороны: доворот к ближайшему 0° (A) или 180° (B) с перелётом — чтобы не
      // читать карту ребром. Исход при этом не меняется.
      const target=Math.round((ang-(side==='A'?0:180))/360)*360+(side==='A'?0:180);
      if(!reduced()){
        const from=ang,t1=performance.now(),D=.24;
        const settle=now=>{const t=Math.min(1,(now-t1)/1000/D);if(!el.isConnected)return;
          const k=1-Math.pow(1-t,3);window.ChanceDepth?.light(cardEl,from+(target-from)*k); // easeOutCubic
          spinEl.style.transform=`rotateY(${from+(target-from)*k}deg)`;shadow.style.transform=`scaleX(${0.35+0.65*Math.abs(Math.cos((from+(target-from)*k)*Math.PI/180))})`;
          if(t<1)requestAnimationFrame(settle);};requestAnimationFrame(settle);
        cardEl.animate([{transform:'scale(1)'},{transform:'scale(1.035,.98)',offset:.35},{transform:'scale(.99,1.02)',offset:.6},{transform:'scale(1)'}],{duration:260,easing:'ease-out'});
        take.animate([{transform:'translateY(20px) scale(.8)',opacity:0},{transform:'translateY(-4px) scale(1.04)',opacity:1,offset:.7},{transform:'none'}],{duration:340,easing:'cubic-bezier(.34,1.56,.64,1)'});
      } else spinEl.style.transform=`rotateY(${target}deg)`;
      snd(good?'joy':bad?'negative':'ui');
      take.focus();
      take.onclick=()=>{
        if(claiming)return;claiming=true;take.disabled=true;
        if(!reduced()){el.animate([{opacity:1},{opacity:0}],{duration:160,fill:'forwards'});setTimeout(finish,160);}
        else finish();
      };
    };
    const tick=now=>{if(!el.isConnected||done)return;const dt=Math.max(0,(now-last)/1000);last=now;
      if(document.hidden){requestAnimationFrame(tick);return;}activeMs+=dt*1000;
      if(!stopping&&activeMs>p.autoMs)stop();
      ang=rotor.advance(dt);window.ChanceDepth?.light(cardEl,ang);spinEl.style.transform=`rotateY(${ang}deg)`;
      // тень сужается, когда карта стоит ребром — объём без 3D-движка
      shadow.style.transform=`scaleX(${0.35+0.65*Math.abs(Math.cos(ang*Math.PI/180))})`;
      if(rotor.stopped){land();return;}
      requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
  });
};

      if(c.r==='gold'&&test.filter(x=>byId(x).r==='gold').length>2)return draw('Золотых — не больше двух.');

  while(st.soldPaid<steps){st.soldPaid++;S.cash+=M1.soldBonus;S.rolls+=M1.soldBonusRolls;toast(`Продано ${st.soldPaid*M1.soldStep} шт. — премия $${M1.soldBonus} и +${M1.soldBonusRolls} ходов`,2600);track('map_bonus',{map:1,sold:st.soldPaid*M1.soldStep});}

  const mine=myKiosks(),stock=mine.reduce((a,t)=>a+t.goods,0);

  if(mine.length&&!stock&&S.cash<Math.min(...mine.map(t=>buyPrice(t.good)))*4&&$('modal').hidden&&!moving&&!st.rescued){

const sfBase=G=>3+(G-1);                                          // продажи за круг по уровню: 3 на 1-м, +1 за уровень
function sfSell(cat){return SF.sell[cat]||good(cat).sell;}
function sfMargin(cat){return Math.max(1,sfSell(cat)-good(cat).buy);}

// Поле: пустыри вместо готовых точек. Служебные клетки как в Бруклине (углы: старт, бандит, банк, копилка на 25), «Шанса» нет.
buildTiles=function(){
  const biz=new Set([3,8,17,23,32,37]),wh=new Set([6,19,24,30,34]);
  const r10=(a,b)=>Math.round((a+Math.random()*(b-a))/10)*10;let k=0;const t=[];
  for(let i=0;i<40;i++){
    const o={i,type:'kiosk',zone:0,owner:null,level:0,capLvl:1,salesLvl:1,goods:0,tier:1};
    if(i===0)o.type='home';
    else if(i===10){o.type='slot';o.zone=-1;}
    else if(wh.has(i)){o.type='wh';o.zone=-1;}
    else if(i===5){o.type='hazard';o.zone=-1;}
    else if(i===15){o.type='police';o.zone=-1;}
    else if(i===20){o.type='bank';o.zone=-1;} // угол — банк, как в Бруклине (решение 30.09)
    else if(i===25){o.type='pot';o.zone=-1;}
    else if(i===35){o.type='scatter';o.zone=-1;}
    else if(biz.has(i)){o.type='biz';o.price=r10(150,250);o.price0=o.price;}
    else{k++;o.good='lot';o.base=null;o.lot=true;o.price=sfPrice('gum');o.price0=o.price;}
    t.push(o);
  }
  return t;
};

        <span class="sf-stats"><span>≈ <i class="cash-glyph"></i>${profit}<em>за круг</em></span><span>запас <i class="cash-glyph"></i>${fill}</span><span>стройка <i class="cash-glyph"></i>${p}</span></span></span>
      <span class="sf-price">${price}</span></div>`;}).join('');

   const copy=source.cloneNode(true);copy.removeAttribute('id');copy.removeAttribute('style');
   copy.querySelectorAll('[id]').forEach(n=>{n.dataset.mirror=n.id;n.removeAttribute('id');});
   bar.append(copy);sources.push(source);
  }
  const sync=()=>bar.querySelectorAll('[data-mirror]').forEach(n=>{const source=$(n.dataset.mirror);if(source&&n.innerHTML!==source.innerHTML)n.innerHTML=source.innerHTML;});
  const observer=new MutationObserver(sync);sources.forEach(s=>observer.observe(s,{subtree:true,childList:true,characterData:true}));
  layer.classList.add('minigame-layer');frame.classList.add('minigame-frame');layer.prepend(bar);
  const fit=()=>{const r=app.getBoundingClientRect();Object.assign(layer.style,{left:Math.round(r.left)+'px',right:'auto',width:Math.round(r.width)+'px'});const root=frame.contentDocument?.documentElement;if(root)root.style.setProperty('--room-height',(layer.getBoundingClientRect().height||innerHeight)+'px');};
  let loaded=false,requested=false,revealed=false,closing=false,disposed=false,subject=null,exitPromise;
  const animations=new Set(),reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
  const play=(node,keys,options)=>{
   const animation=node.animate(keys,options);animations.add(animation);
   animation.finished.catch(()=>{}).finally(()=>animations.delete(animation));return animation;
  };
  const reveal=()=>{
   if(!loaded||!requested||revealed||closing||disposed)return;
   revealed=true;fit();
   // Animate the fitted artwork, not its painted room or the shared resource bar.
   subject=frame.contentDocument?.querySelector('.stage, #viewport');
   if(subject){
    subject.style.willChange='transform, opacity';
    const keys=reduced()?[{opacity:0},{opacity:1}]:[
     {opacity:0,transform:'translateY(30px) scale(.965)',offset:0},
     {opacity:1,transform:'translateY(-3px) scale(1.004)',offset:.76},
     {opacity:1,transform:'none',offset:1}
    ];
    play(subject,keys,{duration:reduced()?80:240,easing:'cubic-bezier(.2,.8,.2,1)'}).finished.catch(()=>{}).finally(()=>{subject.style.willChange='';});
   }
   layer.classList.add('minigame-ready');
   layer.querySelector('.sl-loading')?.remove();layer.querySelector('.sl-loading-close')?.remove();
  };
  const onLoad=()=>{loaded=true;fit();reveal();};
  fit();frame.addEventListener('load',onLoad);addEventListener('resize',fit);sync();
  const dispose=()=>{disposed=true;animations.forEach(a=>a.cancel());animations.clear();frame.removeEventListener('load',onLoad);observer.disconnect();removeEventListener('resize',fit);};
  dispose.ready=()=>{requested=true;reveal();};
  dispose.close=()=>{
   if(exitPromise)return exitPromise;
   closing=true;frame.inert=true;layer.classList.add('minigame-closing');
   const pose=subject?getComputedStyle(subject):null;
   const from=pose?{opacity:pose.opacity,transform:pose.transform}:null;
   animations.forEach(a=>a.cancel());animations.clear();
   const duration=reduced()?80:160;
   if(subject&&from)play(subject,[from,reduced()?{opacity:0}:{opacity:0,transform:'translateY(24px) scale(.975)'}],{duration,easing:'cubic-bezier(.4,0,.8,.2)',fill:'forwards'});
   exitPromise=play(layer,[{opacity:getComputedStyle(layer).opacity},{opacity:0}],{duration:reduced()?80:110,delay:reduced()?0:50,easing:'ease-in',fill:'forwards'}).finished.catch(()=>{});
   return exitPromise;
  };
  return dispose;
 }
};

/* Dice 21: presentation-independent, synchronous transactions. */
(function(root){
'use strict';
const CHIPS=[25,50,100,250,500], clone=x=>JSON.parse(JSON.stringify(x));
const total=dice=>dice.reduce((a,b)=>a+b,0);
const initial=()=>({phase:'betting',chips:[],player:[],dealer:[],stake:0,result:null,round:0,freeBet:0,houseChips:0,house:0,visitGames:0,visitLimit:0});
// Остановка на клетке: первая партия на ставку заведения (фишки уже на столе, снять нельзя),
// игрок может докинуть своих сверху; вторая — только на свои, после неё стол закрывается
// (решение продюсера 30.09.2026).
const VISIT_GAMES=2;
function chipsFor(amount){const out=[];let left=Math.max(0,Math.round(amount/25)*25);for(const v of [...CHIPS].reverse()){while(left>=v&&out.length<24){out.push(v);left-=v;}}return out;}
function transition(saved,action,cash,roll=()=>1+Math.floor(Math.random()*6)){
 const s=clone(saved||initial());let delta=0;
 const die=()=>{const n=roll();if(!Number.isInteger(n)||n<1||n>6)throw Error('Invalid die');return n;};
 const resolve=()=>{
  const p=total(s.player);
  if(p<=21){s.dealer=[die(),die(),die()];while(total(s.dealer)<=p&&total(s.dealer)<21)s.dealer.push(die());}
  const d=total(s.dealer), outcome=p>21?'lose':d>21||p>d?'win':p===d?'push':'lose';
  // Часть заведения: при выигрыше даёт чистую прибыль в свой размер, при ничьей и проигрыше сгорает.
  // Своя часть — как обычно: выигрыш ×2, ничья возвращается, проигрыш уходит дилеру.
  const own=s.stake-s.house;
  const returned=outcome==='win'?own*2+s.house:outcome==='push'?own:0;
  delta+=returned;s.phase='result';s.result={outcome,returned,net:returned-own,free:s.house>0,house:s.house,own,player:p,dealer:d,reason:p>21?'player-bust':d>21?'dealer-bust':outcome==='push'?'tie':'points'};
 };
 if(action.type==='visit'&&s.phase==='betting'){
  const chips=chipsFor(action.stake);if(!chips.length)return {ok:false,error:'Ставка заведения слишком мала'};
  s.chips=chips;s.freeBet=total(chips);s.houseChips=chips.length;s.house=0;s.visitGames=0;s.visitLimit=VISIT_GAMES;
 }else if(action.type==='add'&&s.phase==='betting'){
  if(!CHIPS.includes(action.value))return {ok:false,error:'Неизвестная фишка'};
  // Своя фишка списывается сразу, как легла на стол (решение продюсера 30.09.2026); снял — вернулась.
  if(action.value>cash)return {ok:false,error:'Не хватает денег на эту фишку'};
  if(s.chips.length>=24)return {ok:false,error:'На столе уже 24 фишки'};
  s.chips.push(action.value);delta=-action.value;
 }else if(action.type==='remove'&&s.phase==='betting'){
  if(!Number.isInteger(action.index)||action.index<0||action.index>=s.chips.length)return {ok:false};
  if(action.index<s.houseChips)return {ok:false,error:'Фишки заведения не снимаются'};
