<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Америкэн бой · интерфейсы</title><style>
@font-face{font-family:Bitter;src:url(../assets/fonts/bitter-700-cyrillic.woff2);font-weight:700}*{box-sizing:border-box}body{margin:0;background:#282720;color:#f0dfb7;font:16px/1.4 Bitter,Georgia,serif}header{padding:20px 24px;border-bottom:2px solid #675b40;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:0}header p{font:15px/1.4 system-ui;margin:0;color:#c4b798}.layout{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:24px;padding:24px;align-items:start}.preview{position:sticky;top:16px}iframe{display:block;width:100%;height:844px;max-height:calc(100dvh - 110px);border:3px solid #897248;border-radius:16px;background:#282720}button,select{font:700 16px Bitter,Georgia,serif;color:#352d21;background:#ead8af;border:2px solid #8d744d;border-radius:7px;padding:9px 12px;cursor:pointer}button:hover,button.on{background:#b13e2c;color:#ffedc6;border-color:#f2dba1}nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}h2{font-size:23px;margin:28px 0 12px}.line{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.art{padding:10px;background:#efdfb7 url(../assets/print/card-stock.png) center/400px;border:2px solid #8d744d;text-align:center;box-shadow:0 3px #181b16}.art img{width:100%;aspect-ratio:3/2;object-fit:contain;display:block}.art span{display:block;padding-top:8px;font-size:15px}.biz{grid-template-columns:repeat(3,minmax(0,1fr))}.hint{font:14px/1.4 system-ui;color:#c4b798}.controls{padding-top:12px}input{width:140px;accent-color:#bd4934}a{color:#efd6a0}@media(max-width:1100px){.layout{grid-template-columns:1fr 390px;padding:14px;gap:16px}.line{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.layout{display:flex;flex-direction:column-reverse;padding:12px}.preview{position:static;width:100%;max-width:410px;margin:auto}iframe{height:750px;max-height:80dvh}.library{width:100%}header{padding:14px}header p{display:none}}
</style><script src="../property-art.js?v=complete-1"></script></head><body><header><h1>Америкэн бой · интерфейсы</h1><p>Просмотр на отдельном тестовом сохранении. Игровой прогресс не меняется.</p></header><div class="layout"><main class="library"><nav><button data-view="point">Точки</button><button data-view="business">Бизнесы</button><button data-view="warehouse">Склад</button><button data-view="field">Поле</button><button data-view="johnny">Джонни</button><button data-view="shop">Магазин</button><button data-view="police">Полиция</button><button data-view="shipping">Поставка</button><button data-view="chance">Шанс</button><button data-view="tree">Развитие</button><button data-view="map-end">Карта пройдена</button></nav><div id="lines"></div><h2>Мейн-стрит · бизнесы</h2><div id="businesses" class="line biz"></div><div id="brooklynBusinesses"></div></main><aside class="preview"><iframe title="Игровой интерфейс" id="game" src="../index.html?map=1&playtest=1&review=1&window=point"></iframe><div class="tree-controls controls" style="display:none"><label>После карты <select id="treeAfter" aria-label="Переход между картами"><option value="1">1 · Мейн-стрит</option><option value="2">2 · Атлантик-Сити</option><option value="3">3 · Детройт</option><option value="4">4 · Карта 4</option></select></label></div><div class="controls property-controls"><select id="artMap" aria-label="Карта"><option value="l5">Бруклин · 16 уровней</option><option value="mainstreet">Мейн-стрит</option><option value="legacy">Бруклин · 7 уровней</option></select><select id="state" aria-label="Состояние карточки"><option value="0">Покупка</option><option value="1">Своя точка</option></select><label>Уровень <b id="levelText">1</b> <input id="level" aria-label="Уровень точки" type="range" min="1" max="16" value="1"></label></div><p class="hint">Покупка бизнеса переворачивает карточку; точка открывается без переворота. Иллюстрации открывают соответствующий формат; ползунок показывает каждый уровень.</p><a href="../index.html?map=1&playtest=1">Вернуться в игру</a></aside></div><script>
const goods={"cola": "Кола", "bud": "Пиво", "champ": "Алкоголь", "gum": "Жвачка", "candy": "Конфеты", "cake": "Кондитерская", "sport": "Спортивные костюмы", "jeans": "Джинсы", "jacket": "Куртки", "keds": "Кеды", "sneak": "Кроссовки", "boots": "Ботинки", "tape": "Кассеты", "walk": "Плееры", "disc": "CD-плееры", "tv": "Телевизоры", "vcr": "Видеомагнитофоны", "cam": "Камеры"},biz={3:'Мотель «Motor Court»',8:'Прачечная',17:'Кинотеатр «Рокси»',23:'Закусочная у трассы',32:'Автомастерская',37:'Бензоколонка'};
let selected='cola',view=['point','business','warehouse','field','johnny','shop','police','shipping','chance','tree','map-end'].includes(new URLSearchParams(location.search).get('view'))?new URLSearchParams(location.search).get('view'):'point',tile=3;
function show(){document.querySelector('.tree-controls').style.display=['tree','map-end'].includes(view)?'flex':'none';document.querySelector('.property-controls').style.display=['point','business'].includes(view)?'flex':'none';document.querySelector('.hint').style.display=['point','business'].includes(view)?'block':'none';const p=new URLSearchParams({playtest:'1',review:'1',window:view,good:selected,level:level.value,owned:state.value,tile,after:treeAfter.value});if(['point','business'].includes(view)){if(artMap.value==='mainstreet')p.set('map','1');else if(artMap.value==='l5')p.set('l5','1');else p.set('tier',Math.min(3,Math.ceil(Number(level.value)/3)));}else if(['warehouse','tree','map-end'].includes(view))p.set('l5','1');else p.set('map','1');game.src='../index.html?'+p;levelText.textContent=level.value;}
for(const [id,name] of Object.entries(goods)){const title=document.createElement('h2');title.textContent=name;const row=document.createElement('div');row.className='line';for(let f=1;f<=4;f++){const b=document.createElement('button');b.className='art';b.innerHTML=`<img loading="lazy" src="../${PropertyArt.point(id,f)}" alt="${name}, формат ${f}"><span>${(f-1)*4+1}–${f*4}</span>`;b.onclick=()=>{selected=id;view='point';artMap.value='l5';level.max=16;level.value=(f-1)*4+1;state.value='1';show();};row.append(b);}lines.append(title,row);}
for(const [id,name] of Object.entries(biz)){const b=document.createElement('button');b.className='art';b.innerHTML=`<img loading="lazy" src="../${PropertyArt.business(id)}" alt="${name}"><span>${name}</span>`;b.onclick=()=>{tile=id;view='business';artMap.value='mainstreet';level.value=1;state.value='0';show();};businesses.append(b);}

function extraRow(host,title,items){const h=document.createElement('h2');h.textContent=title;const row=document.createElement('div');row.className='line biz';for(const item of items){const b=document.createElement('button');b.className='art';b.innerHTML=`<img loading="lazy" src="../${item.src}" alt="${item.name}"><span>${item.name}</span>`;b.onclick=item.open;row.append(b);}host.append(h,row);}
for(const [id,name] of Object.entries({3:'Прачечная',8:'Пиццерия',17:'Тир',23:'Хот-доги',32:'Автосалон',37:'Клуб'}))extraRow(brooklynBusinesses,'Бруклин · '+name,[1,2,3].map(stage=>({name:name+' · '+stage,src:PropertyArt.business(id,stage,'brooklyn'),open:()=>{tile=id;view='business';artMap.value='l5';level.max=9;level.value=(stage-1)*3+1;state.value='1';show();}})));
extraRow(lines,'Бруклин · прежняя линейка',Object.entries({marl:'Сигареты',cigar:'Сигары',levis:'Плотная джинса',jordan:'Баскетбольные кеды',bmx:'Велосипеды',comp:'Компьютеры'}).map(([id,name])=>({name,src:PropertyArt.point(id),open:()=>{selected=id;view='point';artMap.value='legacy';level.max=4;level.value=1;state.value='1';show();}})));
artMap.onchange=()=>{if(artMap.value==='mainstreet'&&!['cola','bud','champ','gum','candy','cake'].includes(selected))selected='cola';if(artMap.value==='l5'&&['marl','cigar','levis','jordan','bmx','comp'].includes(selected))selected='cola';level.max=artMap.value==='l5'?(view==='business'?9:16):4;level.value=1;show();};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;show();});level.onchange=show;state.onchange=show;treeAfter.onchange=show;show();
</script></body></html>
